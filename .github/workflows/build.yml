name: build
on:
  push:
    branches: [elder-blood-addon]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Latest versions
        run: |
          NEO=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -o '<version>21\.1\.[0-9]*</version>' | sed 's/<[^>]*>//g' | sort -t. -k3 -n | tail -1)
          MDG=$(curl -s https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml | grep -o '<version>2\.0\.[0-9]*</version>' | sed 's/<[^>]*>//g' | sort -t. -k3 -n | tail -1)
          echo "NEO=$NEO MDG=$MDG"
          [ -n "$NEO" ] && sed -i "s/^neo_version=.*/neo_version=$NEO/" gradle.properties
          [ -n "$MDG" ] && sed -i "s/^moddev_version=.*/moddev_version=$MDG/" gradle.properties
          cat gradle.properties
      - name: Build
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Publish result
        if: always()
        run: |
          mkdir -p /tmp/out && cp build.log /tmp/out/ 2>/dev/null || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          git config user.name github-actions; git config user.email actions@github.com
          git checkout --orphan build-output
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/out/* . 
          git add -f . && git commit -m "build output" && git push -f origin build-output
