name: build
on:
  push:
    branches: [main, smart-ai]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build
        shell: bash
        run: gradle build --stacktrace 2>&1 | tee /tmp/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: village-guard
          path: build/libs/*.jar

      # Служебный шаг: выкладывает в ветку "sigs" список классов и методов Minecraft,
      # чтобы код можно было писать по настоящим именам, а не наугад.
      - name: Dump Minecraft API signatures
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/out
          cp /tmp/build.log /tmp/out/sigs-build.log || true
          cp build/libs/village-guard-1.0.0.jar /tmp/out/village-guard.jar || true
          MC=""
          for J in $(find ~/.gradle -type f -name '*.jar' -size +5M | grep -vi sources); do
            if unzip -l "$J" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class'; then MC="$J"; break; fi
          done
          echo "jar: $MC" > /tmp/out/sigs-info.txt
          unzip -Z1 "$MC" | grep '\.class$' | sed 's/\.class$//' | grep -E 'Piglin|Humanoid|ArmorModelSet|ArmorLayer|EquipmentLayer|ModelLayers|EntityRendererProvider|EntityRenderers|VillagerRenderer|ZombieRenderer|ZombieModel|ItemInHand|RenderState|EntityModel|LayerDefinition|MeshDefinition|PartDefinition|CubeListBuilder|CubeDeformation|Villager|MeleeAttack|HurtByTarget|NearestAttackable|MoveTowards|Entity$|/Mob$|PathfinderMob' > /tmp/out/sigs-classes.txt
          # Сигнатуры избранных классов
          grep -E '/(PiglinRenderer|PiglinModel|AbstractPiglin|HumanoidMobRenderer|HumanoidModel|HumanoidRenderState|ArmorModelSet|HumanoidArmorLayer|EquipmentLayerRenderer|ModelLayers|EntityRendererProvider|EntityRendererProvider\$Context|EntityRenderers|MobRenderer|LivingEntityRenderer|VillagerRenderer|ZombieRenderer|AbstractZombieRenderer|ZombieModel|ItemInHandLayer|LivingEntityRenderState|ArmedEntityRenderState|PiglinRenderState|EntityModel|LayerDefinition|MeshDefinition|PartDefinition|PartPose|CubeListBuilder|CubeDeformation|ModelPart|Entity|Mob|Villager|MeleeAttackGoal|HurtByTargetGoal|NearestAttackableTargetGoal|MoveTowardsRestrictionGoal)$' /tmp/out/sigs-classes.txt > /tmp/out/sigs-picked.txt
          : > /tmp/out/sigs.txt
          while read C; do javap -p -cp "$MC" "$C" >> /tmp/out/sigs.txt 2>&1; echo >> /tmp/out/sigs.txt; done < /tmp/out/sigs-picked.txt
          # Сигнатуры классов ИИ (цели, навигация, мобы, жители)
          unzip -Z1 "$MC" | grep '\.class$' | sed 's/\.class$//' | grep -E '^net/minecraft/world/entity/(ai/goal/|ai/targeting/|ai/navigation/|ai/control/|npc/villager/|monster/(Monster|zombie/|skeleton/|Spider|Creeper|Pillager|AbstractIllager|Raider|RangedAttack)|PathfinderMob|LivingEntity$|Mob$|EntityType$)|^net/minecraft/world/(level/Level$|level/LevelReader$|level/BlockGetter$|level/block/Blocks$|level/block/state/BlockState$|level/block/state/BlockBehaviour|item/Items$|item/ItemStack$|level/block/DoorBlock$|level/block/TorchBlock$)|^net/minecraft/server/level/ServerLevel$' | grep -v '\$[0-9]' > /tmp/out/sigs-ai-classes.txt
          : > /tmp/out/sigs-ai.txt
          while read C; do javap -p -cp "$MC" "$C" >> /tmp/out/sigs-ai.txt 2>&1; echo >> /tmp/out/sigs-ai.txt; done < /tmp/out/sigs-ai-classes.txt
          # Список констант слоёв моделей (названия)
          javap -p -constants -cp "$MC" net.minecraft.client.model.geom.ModelLayers 2>/dev/null | grep -iE 'PIGLIN|VILLAGER|ZOMBIE\b|ARMOR' > /tmp/out/sigs-layers.txt || true
      - name: Publish signatures branch
        if: always()
        continue-on-error: true
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git switch --orphan sigs
          git rm -rf . -q 2>/dev/null || true
          cp /tmp/out/* .
          git add sigs* *.jar
          git commit -m "signatures" -q
          git push -f origin sigs
