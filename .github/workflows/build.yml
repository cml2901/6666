name: build
on:
  push:
    branches: [eredrin-abilities]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Pick latest NeoForge 21.1.x and ModDevGradle
        run: |
          NF=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | grep -oE '<version>21\.1\.[0-9]+</version>' | sed -E 's/<[^>]+>//g' | sort -V | tail -1)
          MDG=$(curl -fsSL https://plugins.gradle.org/m2/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml \
            | grep -oE '<version>[0-9]+\.[0-9]+\.[0-9]+</version>' | sed -E 's/<[^>]+>//g' | sort -V | tail -1)
          echo "NeoForge=$NF ModDevGradle=$MDG"
          sed -i "s/^neo_version=.*/neo_version=$NF/; s/^moddev_version=.*/moddev_version=$MDG/" gradle.properties
          cat gradle.properties

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eredrin-abilities
          path: build/libs/*.jar

      # Кладём лог и jar в ветку build-output, чтобы их можно было забрать через git.
      - name: Publish build output
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          git config user.name github-actions
          git config user.email actions@github.com
          git switch --orphan build-output
          git rm -rf . -q 2>/dev/null || true
          cp /tmp/out/* . 2>/dev/null || true
          git add -A
          git commit -m "build output ${{ github.sha }}" -q || true
          git push -f origin build-output

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
