plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

version = mod_version
group = mod_group_id

base {
	archivesName = "elderblood-addon-1.21.1"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
	mavenCentral()
	maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/maven' }
}

neoForge {
	version = project.neo_version

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

dependencies {
	// Witcher World (только классы, для компиляции) и BjornLib
	compileOnly files('libs/witcherworld-classes.jar', 'libs/bjornlib-1.0.88.jar')
	compileOnly 'org.spongepowered:mixin:0.8.5'
	compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
